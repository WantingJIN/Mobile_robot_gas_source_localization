# =============================================================================
# Simulation Configuration
# =============================================================================
# Parameters are grouped by component. Conditional sub-parameters are nested
# directly under the key whose value activates them, e.g.:
#
#   modelUncertainty: DYNAMIC_UNCERTAINTY
#   DYNAMIC_UNCERTAINTY:          # only active when modelUncertainty = DYNAMIC_UNCERTAINTY
#     windBeliefWeight: 0.4
#
# =============================================================================

# --- General ---
simulation:
  simuMode: ONLINE                  # ONLINE | OFFLINE
  experimental_logname: "physics_encoded_GSL/fixed_sigma_normalization_dijstra/10/1760633017749"
  map_nbr: 0

# --- Robot ---
robot:
  number_of_robots: 3
  vel_factor: 1.0

# --- Sensing ---
sensing:
  samplingMode: CONTINOUS_SAMPLING  # CONTINOUS_SAMPLING | STOP_AND_GO_SAMPLING | SENSE_WITHOUT_STOP
  CONTINOUS_SAMPLING:               # sub-params: active when samplingMode = CONTINOUS_SAMPLING
    sampling_period: 3
    sampling_dist_thresh: 0.1
  STOP_AND_GO_SAMPLING:             # sub-params: active when samplingMode = STOP_AND_GO_SAMPLING
    sampling_period: 3
    sampling_dist_thresh: 0.1
  processingMode: NO_PROCESSING     # NO_PROCESSING | KERNEL_MAPPING | DECONVOLUTION | MAPPING_AND_DECONVOLUTION
  gasSensor: MOX                    # PID | MOX | NOISY_MOX | SLOW_MOX | VERY_SLOW_MOX | NOISY_SLOW_MOX | NOISY_VERY_SLOW_MOX
  calibrationMode: OFF              # OFF | LINEAR | NOLINEAR
  NOLINEAR:                         # sub-params: active when calibrationMode = NOLINEAR
    R0: 100

# --- Gas Feature Extraction ---
gas_feature:
  gasFeature: RELATIVE_VALUE        # ABSOLUTE_VALUE | RELATIVE_VALUE | GASHIT

  RELATIVE_VALUE:                   # sub-params: active when gasFeature = RELATIVE_VALUE
    relativeMethod: Z_SCORE         # NORMALIZATION | Z_SCORE | EMPIRICAL_CDF | EMPIRICAL_CDF_AND_SLOPE | EMPIRICAL_CDF_NUM
    # likelihoodSigma is read from the active relativeMethod sub-block below
    NORMALIZATION:
      likelihoodSigma: 1.0
    Z_SCORE:
      likelihoodSigma: 3.5
    EMPIRICAL_CDF:
      likelihoodSigma: 0.48
    EMPIRICAL_CDF_AND_SLOPE:
      likelihoodSigma: 0.48
    EMPIRICAL_CDF_NUM:
      likelihoodSigma: 0.48
    # Note: Gaussian CDF interpretation of NORMALIZATION uses likelihoodSigma: 0.22

  GASHIT:                           # sub-params: active when gasFeature = GASHIT
    gasHitMethod: FIXED_THRES_NUM   # FIXED_THRES | FIXED_THRES_NUM | MIN_MAX_THRES | SLIDING_WINDOW_THRES | SLIDING_WINDOW_THRES_NUM
    FIXED_THRES:                    # sub-params: active when gasHitMethod = FIXED_THRES or FIXED_THRES_NUM
      gasHitThres: 1000
    SLIDING_WINDOW_THRES:           # sub-params: active when gasHitMethod = SLIDING_WINDOW_THRES
      lambda: 0.7
    SLIDING_WINDOW_THRES_NUM:       # sub-params: active when gasHitMethod = SLIDING_WINDOW_THRES_NUM
      lambda: 0.7

# --- Bayesian Source Estimation ---
bayesian_estimation:
  BayesianModelingMethod: EXHAUSTIVE  # MCMC | EXHAUSTIVE
  MCMC:                               # sub-params: active when BayesianModelingMethod = MCMC
    MCMC_iteration_num: 1000
  likelihood_error: 3000

# --- Plume Model ---
plume_model:
  plumeModel: DDPM               # GAUSSIAN_PLUME | DDPM | FDM_PDE
  FDM_PDE:                          # sub-params: active when plumeModel = FDM_PDE
    diffCoefficient: 0.008

# --- Wind Estimation ---
wind:
  windInfo: WIND_OFFLINE             # WIND_OFFLINE | WIND_ONLINE
  windEstimationMethod: GAUSSIAN_KERNEL  # GROUND_TRUTH | GAUSSIAN_KERNEL | BASEFLOW_CORRECTION
  estimationScale: GLOBAL           # LOCAL | GLOBAL
  modelUncertainty: DYNAMIC_UNCERTAINTY  # FIXED_UNCERTAINTY | DYNAMIC_UNCERTAINTY
  DYNAMIC_UNCERTAINTY:              # sub-params: active when modelUncertainty = DYNAMIC_UNCERTAINTY
    windBeliefWeight: 0.4

# --- Path Planning ---
planning:
  planningStrategy: RANDOM  # GREEDY | BALANCE_MAXIMAL_EXPECTED | RANDOM | LAWNMOWER |
                                       # BELIEF_CLUSTERING | INFORMATIVE_KLD | INFO_CLUSTERING |
                                       # WEIGHTED_CLUSTERING | SUM_DIJKSTRA_FIX | SUM_DIJKSTRA_ADP | MULTI_DIJKSTRA
  visitedList: visitedList_ON       # visitedList_ON | visitedList_OFF
  infoFeature: PDF                  # VARIANCE | MEAN | PDF
  scoreFun: EXP                     # RATIO | LOG | SIGMOID | SUM | EXP
  scoreSigma: 0.5
  planning_step: 10
  global_local_search_ratio: 0.5

  BELIEF_CLUSTERING:                # sub-params: active when planningStrategy = BELIEF_CLUSTERING or INFO_CLUSTERING
    cluster_entropy_ratio: 4

  SUM_DIJKSTRA_ADP:                 # sub-params: active when planningStrategy = SUM_DIJKSTRA_ADP or WEIGHTED_CLUSTERING
    weighting_entropy_ratio: 10

# --- Team Coordination ---
team:
  teamStrategy: DISTRIBUTED          # INDIVIDUAL | DISTRIBUTED | CENTRALIZED
  updateGoalPolicy: GOAL_REACHED    # GOAL_REACHED | FIXED_FREQ | BELIEF_DIFF
  FIXED_FREQ:                       # sub-params: active when updateGoalPolicy = FIXED_FREQ
    updateGoalTime: 5

# --- Termination ---
termination:
  stopCondition: ENTROPY_ONLY       # ENTROPY_ONLY | SPREAD_ONLY | ENTROPY_SPREAD
